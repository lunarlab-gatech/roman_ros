session_name: hercules
suppress_history: false

environment:
  BAG_DIR: '~/data/hercules_test_datasets_V1.1/'
  BAG_PLAY_RATE: '1.0'
  ROS_WS: '~/roman_ros_ws/'
  OPENVINS_CONFIG_PATH: '~/roman_ros_ws/src/roman_ros/roman_ros2/cfg/openvins/hercules/estimator_config.yaml'

options:
  default-command: /bin/bash

windows:
- window_name: Rosbag
  layout: tiled
  focus: true
  shell_command_before:
  - source ${ROS_WS}/install/setup.bash
  panes:
  - shell_command:
    - cd ${BAG_DIR}
    - sleep 10
    - ros2 bag play ausenv_test1_checkpoints_CSLAM_2UAVUGV -r $BAG_PLAY_RATE --log-level info --topics /tf /tf_static /hercules_node/Husky1/front_center_Scene/camera_info /hercules_node/Husky1/front_center_Scene/image /hercules_node/Husky1/front_center_DepthPerspective/camera_info /hercules_node/Husky1/front_center_DepthPerspective/image /hercules_node/Drone1/front_center_Scene/camera_info /hercules_node/Drone1/front_center_Scene/image /hercules_node/Drone1/front_center_DepthPerspective/camera_info /hercules_node/Drone1/front_center_DepthPerspective/image /hercules_node/clock --remap /hercules_node/clock:=/clock --read-ahead-queue 2000
  #- ros2 launch roman_ros2 image_resize_compress.launch.py robot:=Husky1 node_name:=Husky1_ImageResizeCompress
  #- ros2 launch roman_ros2 image_resize_compress.launch.py robot:=Drone1 node_name:=Drone1_ImageResizeCompress
  - 
  -
  -

- window_name: FastSAM & Map
  layout: tiled
  focus: true
  shell_command_before:
  - source ${ROS_WS}/install/setup.bash
  panes:
  - shell_command: 
    - export FASTSAM_WEIGHTS_PATH=${ROS_WS}/models/FastSAM-x.pt
    - ros2 launch roman_ros2 fastsam_example.launch.py robot:=Husky1 node_name:=Husky1_FastSAM bag_play_rate:=$BAG_PLAY_RATE 
  - shell_command: 
    - export FASTSAM_WEIGHTS_PATH=${ROS_WS}/models/FastSAM-x.pt
    - ros2 launch roman_ros2 fastsam_example.launch.py robot:=Drone1 node_name:=Drone1_FastSAM bag_play_rate:=$BAG_PLAY_RATE
  - shell_command: 
    - ros2 launch roman_ros2 roman_map_example.launch.py robot:=Husky1 node_name:=Husky1_RomanMap bag_play_rate:=$BAG_PLAY_RATE expected_fps:=40.0
  - shell_command: 
    - ros2 launch roman_ros2 roman_map_example.launch.py robot:=Drone1 node_name:=Drone1_RomanMap bag_play_rate:=$BAG_PLAY_RATE expected_fps:=40.0

- window_name: Viz
  layout: tiled
  shell_command_before:
  - source ${ROS_WS}/install/setup.bash
  panes:
  # - shell_command:
  #   - rqt
  # - shell_command:
  #   - sleep 2
  #   - wmctrl -r "Default - rqt" -e 0,0,0,2000,1000
  - ros2 launch roman_ros2 low_latency_image_viewer.launch.py robot:=Husky1 node_name:=Husky1_LowLatencyImageViewer expected_fps:=40.0 bag_play_rate:=$BAG_PLAY_RATE
  - ros2 launch roman_ros2 low_latency_image_viewer.launch.py robot:=Drone1 node_name:=Drone1_LowLatencyImageViewer expected_fps:=40.0 bag_play_rate:=$BAG_PLAY_RATE
  -
  -


- window_name: diagnostics
  layout: tiled
  shell_command_before:
  - source ${ROS_WS}/install/setup.bash
  panes:
  - shell_command:
    - python3 /opt/ros/humble/lib/diagnostic_common_diagnostics/cpu_monitor.py 
  - python3 /opt/ros/humble/lib/diagnostic_common_diagnostics/ram_monitor.py
  - shell_command:
    - ros2 run rqt_runtime_monitor rqt_runtime_monitor --force-discover
  - shell_command:
    - sleep 2
    - wmctrl -r "rqt_runtime_monitor__RuntimeMonitor - rqt" -e 0,0,1250,2000,900

- window_name: ROMAN align
  layout: tiled
  focus: true
  shell_command_before:
  - source ${ROS_WS}/install/setup.bash
  panes:
  - ros2 launch roman_ros2 roman_align_example.launch.py robot1:=Husky1 robot2:=Drone1
  - ros2 run rviz2 rviz2 -d ${ROS_WS}/src/roman_ros/roman_ros2/rviz/hercules_rviz.rviz
  - 
  -

- window_name: exit
  layout: tiled
  shell_command_before:
  - source ${ROS_WS}/install/setup.bash
  panes:
  - shell_command:
    - cmd: tmux kill-session -t hercules
      enter: false