weights_path: "$FASTSAM_WEIGHTS_PATH"
imgsz: [256, 256]
device: 'cuda'
mask_downsample_factor: 1 #8
min_mask_len_div: 30
max_mask_len_div: 1
# ignore_people: False
erosion_size: 3 
voxel_size: 0.05
ignore_labels: ['person']
use_keep_labels: False
keep_labels: []
plane_filter_params: [3.0, 1.0, 0.2]
clip: True # DON'T CHANGE AS SETTING TO FALSE IS NOT CURRENTLY SUPPORTED
yolo_imgsz: [256, 256]
depth_scale: 1 # For Hercules Dataset, image has raw depth values in meters. #1000 previous value
max_depth: 300 # For Hercules Dataset, max detph is 16360, but leads to too big of arrays #7.5 previous value